# V1.2 Source Registry - which provider serves which series.
#
# Every series listed here MUST be registered in config/indicators.yaml;
# canonical metadata (name/unit/frequency/category) comes from that registry.
#
# provider_code meanings per provider:
#   fred        - FRED series id (DFII10, DTWEXBGS, ANFCI, ...)
#   oecd        - "<flowRef>/<sdmx key>" string
#   chinamoney  - currency pair as the API names it (USD/CNY)
#   chinabond   - curve term label (10 = 10-year CGB point)
#   akshare     - instrument code for index_zh_a_hist (000300 = CSI300)
#   nyfed       - rate type (SOFR)
#   pbc         - LPR_1Y / LPR_5Y
#   safe        - currency name in the parity table (美元)
#   chicagofed  - index column name (ANFCI / NFCI)
#   wind_manual - unused; the series can only be updated via Wind export

defaults:
  overlap_days: 45   # incremental fetches re-pull this many days before the
                     # last stored observation to pick up revisions

providers:
  fred:
    module: fred
    adapter_class: FredAdapter
    timeout_seconds: 90   # fredgraph needs >45s on this network (V1.2C finding)
  oecd:
    module: oecd
    adapter_class: OecdAdapter
    timeout_seconds: 60
  chinamoney:
    module: chinamoney
    adapter_class: ChinaMoneyAdapter
    timeout_seconds: 30
  chinabond:
    module: chinabond
    adapter_class: ChinaBondAdapter
    timeout_seconds: 30
  akshare:
    module: akshare_source
    adapter_class: AkshareAdapter
    timeout_seconds: 60
  nyfed:
    module: nyfed
    adapter_class: NyFedAdapter
    timeout_seconds: 30
  pbc:
    module: pbc
    adapter_class: PbcAdapter
    timeout_seconds: 30
  safe:
    module: safe
    adapter_class: SafeAdapter
    timeout_seconds: 30
  chicagofed:
    module: chicagofed
    adapter_class: ChicagoFedAdapter
    timeout_seconds: 60
    options:
      # one file carries NFCI + ANFCI; verified 2026-08-29 (HTTP 200)
      url: https://api.data.chicagofed.org/NFCI/nfci-data-series-csv.csv
  wind_manual:
    module: wind_manual
    adapter_class: WindManualAdapter
  nbs:
    module: nbs
    adapter_class: NbsAdapter
    timeout_seconds: 30
    options:
      max_pages: 12   # listing archive pages to walk (~1 year of releases)
  manual_series:
    module: manual_series
    adapter_class: ManualSeriesAdapter
  treasury:
    module: treasury
    adapter_class: TreasuryAdapter
    timeout_seconds: 45
  fed_h10:
    module: fedh10
    adapter_class: FedH10Adapter
    timeout_seconds: 30

series:
  # --- OECD (V1.2A Batch A chain: CLI / CPI / production / retail / exports)
  CHN_CLI:
    primary: oecd
    provider_code: "OECD.SDD.STES,DSD_KEI@DF_KEI,4.0/CHN.M.LI.IX._T.AA."
    frequency: monthly
    category: macro
    max_staleness_days: 90
    update_policy:
      mode: replace_window   # OECD revises recent months
    freshness:
      expected_release_lag_days: 50
    original_source: OECD Composite Leading Indicators (CLI), China

  CHN_CPI_INDEX:
    primary: oecd
    provider_code: "OECD.SDD.STES,DSD_KEI@DF_KEI,4.0/CHN.M.CP.IX._Z._Z."
    frequency: monthly
    category: macro
    max_staleness_days: 90
    update_policy:
      mode: replace_window   # OECD revises recent months
    freshness:
      expected_release_lag_days: 50
    original_source: OECD Main Economic Indicators, China CPI index

  CHN_IND_PROD_INDEX:
    primary: oecd
    provider_code: "OECD.SDD.STES,DSD_KEI@DF_KEI,4.0/CHN.M.PRVM.IX.F.Y."
    frequency: monthly
    category: macro
    max_staleness_days: 90
    update_policy:
      mode: replace_window   # OECD revises recent months
    freshness:
      expected_release_lag_days: 50
    original_source: OECD Main Economic Indicators, China industrial production

  CHN_RETAIL_SALES_INDEX:
    primary: oecd
    provider_code: "OECD.SDD.STES,DSD_KEI@DF_KEI,4.0/CHN.M.RS.IX._T.RT."
    frequency: monthly
    category: macro
    max_staleness_days: 90
    update_policy:
      mode: replace_window   # OECD revises recent months
    freshness:
      expected_release_lag_days: 50
    original_source: OECD Main Economic Indicators, China retail sales volume

  CHN_EXPORT_YOY:
    primary: oecd
    provider_code: "OECD.SDD.STES,DSD_KEI@DF_KEI,4.0/CHN.M.EX.GR._T.Y."
    frequency: monthly
    category: macro
    max_staleness_days: 90
    update_policy:
      mode: replace_window   # OECD revises recent months
    freshness:
      expected_release_lag_days: 50
    original_source: OECD Main Economic Indicators, China export growth

  # --- ChinaMoney (V1.2A)
  USD_CNY:
    primary: chinamoney
    fallback: wind_manual
    provider_code: "USD/CNY"
    frequency: daily
    category: macro
    max_staleness_days: 7
    original_source: CFETS central parity via ChinaMoney
    manual_instructions: >
      Export the USD/CNY central parity from Wind to data/inbox/wind/ and run
      python scripts/import_wind.py <file> (column registered as 美元兑人民币:中间价)

  # --- ChinaBond (V1.2C: pgxh/yzQuery endpoint, replaces retired searchYc)
  CN_GOV_YIELD_10Y:
    primary: chinabond
    fallback: wind_manual
    provider_code: "10"
    frequency: daily
    category: macro
    max_staleness_days: 7
    original_source: ChinaBond 10Y CGB yield curve
    manual_instructions: >
      Export the 10Y CGB yield from Wind (中债国债收益率:10年) to data/inbox/wind/
      and run python scripts/import_wind.py <file>

  # --- AKShare (V1.2A; optional dependency, MANUAL_REQUIRED when missing)
  CSI300:
    primary: akshare
    fallback: wind_manual
    provider_code: "000300"
    frequency: daily
    category: market
    max_staleness_days: 7
    original_source: CSI300 index via AKShare
    manual_instructions: >
      Export CSI300 closes from Wind to data/inbox/wind/ and run
      python scripts/import_wind.py <file>

  # --- NY Fed (V1.2B)
  US_SOFR:
    primary: nyfed
    provider_code: "SOFR"
    frequency: daily
    category: market
    max_staleness_days: 7
    original_source: New York Fed secured overnight financing rate

  # --- Chicago Fed + FRED (V1.2B / V1.2A)
  ANFCI:
    primary: chicagofed
    fallback: fred
    provider_code: "ANFCI"
    fallback_code: "ANFCI"
    frequency: weekly
    category: macro
    max_staleness_days: 21
    update_policy:
      mode: replace_window   # light revisions of recent weeks (round-2 calendar)
    freshness:
      expected_release_lag_days: 5
    original_source: Chicago Fed Adjusted National Financial Conditions Index

  # --- FRED (V1.2A)
  US_REAL_YIELD_10Y:
    # v0.4c Task 2: Treasury par real yield is PRIMARY (same underlying data
    # FRED redistributes - DFII10's source IS the Treasury curve). Switching
    # is gated on scripts/overlap_check.py >= 60 common trading days vs FRED
    # DFII10; the check is currently BLOCKED by the FRED network blocker and
    # must PASS before FRED rows are ever merged into this series.
    primary: treasury
    fallback: fred
    provider_code: "10"
    fallback_code: "DFII10"
    frequency: daily
    category: macro
    max_staleness_days: 14
    update_policy:
      mode: append
    freshness:
      expected_release_lag_days: 1
    original_source: >
      U.S. Treasury Daily Treasury Par Real Yield Curve, 10-year (percent).
      Fallback FRED DFII10 (validation/fallback only, same definition)

  USD_BROAD:
    primary: fred
    fallback: fed_h10
    provider_code: "DTWEXBGS"
    fallback_code: "BROAD"
    frequency: daily
    category: macro
    max_staleness_days: 14
    freshness:
      expected_release_lag_days: 4   # H.10 weekly release covers the prior week
    original_source: >
      Fed broad trade-weighted USD index (Jan 2006 = 100). Primary FRED
      DTWEXBGS; fallback Fed H.10 release page (current week only - the DDP
      download program is being retired, so no long-term DDP dependency)
    manual_instructions: >
      Download DTWEXBGS from fred.stlouisfed.org (CSV) or export from Wind and
      run python scripts/import_wind.py <file>

  # --- PBOC (V1.2B)
  CN_LPR_1Y:
    primary: pbc
    provider_code: "LPR_1Y"
    frequency: monthly
    category: macro
    max_staleness_days: 45
    original_source: PBOC monthly LPR announcement

  # --- NBS news-release parsing (V1.2C, P2) -------------------------------
  CHN_PMI_NEW_ORDERS:
    primary: nbs
    fallback: wind_manual
    provider_code: "PMI_NEW_ORDERS"
    frequency: monthly
    category: macro
    max_staleness_days: 60
    freshness:
      expected_release_lag_days: 31   # published on the reference month's last day
    original_source: NBS manufacturing PMI new orders (news release)
    manual_instructions: >
      Export PMI new orders (PMI:新订单) from Wind to data/inbox/wind/, add the
      column to config/wind_mapping.yaml, then run
      python scripts/import_wind.py <file>

  CN_CPI_YOY:
    primary: akshare
    fallback: wind_manual
    provider_code: "CN_CPI_YOY"
    frequency: monthly
    category: macro
    max_staleness_days: 45
    freshness:
      expected_release_lag_days: 11
    original_source: NBS headline CPI YoY via AKShare (access layer);
      I1's declared FALLBACK input - core CPI keeps its own series_id
      (CN_CORE_CPI_YOY) and is never silently overwritten by headline data

  CHN_PMI_INPUT_PRICE:
    primary: nbs
    fallback: wind_manual
    provider_code: "PMI_INPUT_PRICE"
    frequency: monthly
    category: macro
    max_staleness_days: 60
    freshness:
      expected_release_lag_days: 31
    original_source: NBS PMI raw-material input-price index, 13-month table in
      the monthly PMI release (news release)

  CN_CORE_CPI_YOY:
    primary: nbs
    fallback: wind_manual
    provider_code: "CORE_CPI_YOY"
    frequency: monthly
    category: macro
    max_staleness_days: 60
    freshness:
      expected_release_lag_days: 11   # CPI released on the 9th-11th
    original_source: NBS core CPI YoY from the monthly CPI release/interpretation

  CN_PROPERTY_SALES_AREA:
    primary: nbs
    fallback: wind_manual
    provider_code: "PROPERTY_SALES_AREA"
    frequency: monthly
    category: macro
    max_staleness_days: 45
    freshness:
      expected_release_lag_days: 17   # released on the 15th-17th
    original_source: >
      NBS new commercial housing floor space sold, YEAR-TO-DATE cumulative
      YoY growth (%) as published (comparable growth; NBS only publishes
      cumulative levels, so the growth rate is the comparable series)

  CN_PROPERTY_SALES_VALUE:
    primary: nbs
    fallback: wind_manual
    provider_code: "PROPERTY_SALES_VALUE"
    frequency: monthly
    category: macro
    max_staleness_days: 45
    freshness:
      expected_release_lag_days: 17
    original_source: >
      NBS new commercial housing sales value, year-to-date cumulative YoY
      growth (%) as published

  # --- AKShare-routed macro series (V1.2C, P3 access layer) ----------------
  CN_PPI_YOY:
    primary: akshare
    fallback: wind_manual
    provider_code: "CN_PPI_YOY"
    frequency: monthly
    category: macro
    max_staleness_days: 45
    freshness:
      expected_release_lag_days: 11
    original_source: NBS producer price index YoY via AKShare (access layer)

  CN_M2_YOY:
    primary: akshare
    fallback: wind_manual
    provider_code: "CN_M2_YOY"
    frequency: monthly
    category: macro
    max_staleness_days: 45
    freshness:
      expected_release_lag_days: 15
    original_source: PBOC M2 YoY via AKShare (access layer)

  CN_TSF_TOTAL:
    primary: pbc
    fallback: akshare
    provider_code: "TSF_TOTAL"
    frequency: monthly
    category: macro
    max_staleness_days: 45
    update_policy:
      mode: replace_window
    freshness:
      expected_release_lag_days: 15
    original_source: >
      PBOC monthly financial statistics report, year-to-date cumulative TSF
      increment converted to monthly flow (cumulative_to_monthly); fallback
      AKShare shrzgm (PBOC monthly flow)

  CN_GOV_BOND_FINANCING:
    primary: pbc
    provider_code: "GOV_BOND_FINANCING"
    frequency: monthly
    category: macro
    max_staleness_days: 45
    update_policy:
      mode: replace_window
    freshness:
      expected_release_lag_days: 15
    original_source: >
      PBOC monthly financial statistics report, government bond net financing
      year-to-date cumulative converted to monthly flow (cumulative_to_monthly)

  CN_PRIVATE_TSF_YOY:
    # v0.4c Task 5 (D3 spike): DERIVED series - private sector stock YoY
    # computed from the report's AFRE stock and government bond stock with
    # their published YoY rates. Precision ~+/-0.1pp (published rounding).
    primary: pbc
    provider_code: "PRIVATE_TSF_YOY"
    frequency: monthly
    category: macro
    max_staleness_days: 45
    freshness:
      expected_release_lag_days: 15
    original_source: >
      Derived: private TSF stock YoY = (AFRE stock - gov bond stock) growth,
      from PBOC monthly financial statistics report stock paragraph; standard
      definition per docs/research round-1 item 9 (VERIFIED logic)

  # --- Domestic financial conditions (V1.2C) --------------------------------
  CN_DR007:
    primary: chinamoney
    fallback: akshare
    provider_code: "DR007"
    fallback_code: "CN_DR007"
    frequency: daily
    category: macro
    max_staleness_days: 7
    freshness:
      expected_release_lag_days: 0
    original_source: >
      ChinaMoney interbank repo chart DR007 (live; the rolling file only keeps
      ~66 trading days). Fallback/backfill: AKShare repo_rate_hist FDR007
      fixing of the same depository-institution 7-day repo market.

  CN_POLICY_RATE_7D:
    primary: pbc
    fallback: manual_series
    provider_code: "OMO_7D"
    frequency: daily
    category: macro
    max_staleness_days: 21   # event-based: the rate is constant between cuts
    update_policy:
      mode: replace_window
    freshness:
      expected_release_lag_days: 0
    original_source: >
      PBOC 7-day reverse repo operation rate (open-market transaction
      announcements). Fallback: committed step file data/manual_series/
      CN_POLICY_RATE_7D.csv transcribed from the same official
      announcements (MANUAL provenance, expanded to a daily step series).

  US_GSCPI:
    primary: nyfed
    provider_code: "GSCPI"
    frequency: monthly
    category: macro
    max_staleness_days: 45
    update_policy:
      mode: full_refresh
    freshness:
      expected_release_lag_days: 4
    original_source: >
      NY Fed Global Supply Chain Pressure Index (PCA model output; the whole
      history is revised on each release - full_refresh + vintage snapshots)
