          G2: {sign: "+", tier: HIGH,    ref: "R2 §2.6.2"}
          G3: {sign: "+", tier: HIGH,    ref: "R2 §2.6.3"}
          G4: {sign: "+", tier: HIGH,    ref: "R2 §2.6.4"}
