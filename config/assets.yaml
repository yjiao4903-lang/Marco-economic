          I3: {sign: "+", tier: HIGH,    ref: "R2 §2.6.8"}
      domestic_financial:
        beta_range: {low: 1.8, high: 3.0}    # beta (derived) = +2.4
        signals:
          D1: {sign: "-", tier: MEDIUM,  ref: "R2 §2.6.9"}
          D2: {sign: "+", tier: HIGH,    ref: "R2 §2.6.10"}
          D3: {sign: "+", tier: HIGH,    ref: "R2 §2.6.11"}
          D4: {sign: "+", tier: HIGH,    ref: "R2 §2.6.12"}
      global_financial:
        beta_range: {low: -3.6, high: -2.4}  # beta (derived) = -3.0
