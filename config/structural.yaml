# V2.6 Structural Risk layer configuration.
#
# The Structural Risk signals (S1-S3) are medium/long-term FRAGILITY
# diagnostics (MASTER SPEC section 7) that NEVER enter the short-term Asset
# Score (ARCHITECTURE; locked by the asset-layer isolation tests). All values
# in this file are DECLARED PRIORS - economic anchors set by hand, never
# fitted to data, never searched.
#
# Semantics (per signal):
#   direction           "rising series" convention mirroring market.yaml:
#                       `negative` = a RISING raw value is MORE fragile /
#                       deteriorating. S1 = rising credit-to-GDP gap,
#                       S2 = rising debt service ratio.
#   percentile_window   rolling window in OBSERVATIONS (= quarters, the
#                       series are quarterly) used for historical positioning.
#   trend_quarters      delta horizon (quarters) for the trend read.
#   thresholds          declared anchors for the diagnostic label:
#                       - S1 uses level thresholds on the gap (percent):
#                         `elevated` is the BIS 'red zone' prior (credit gap
#                         > 10pp, Borio-Drehmann-Tsatsaronis 2010), and
#                         `above_trend` = gap > 0 means credit is above its
#                         HP trend (fragility building).
#                       - S2 uses percentile thresholds of the DSR's own
#                         history (percentile_window).
#
# S3 (Property Vulnerability) is a four-category proxy pool (景气/杠杆/价格/资金)
# landed with B-package (docs/research/2026-08-30_bpack_structural_survey.md).
# It combines the AVAILABLE proxies (equal-weight percentile composite) and
# reports PARTIAL honestly when some categories have no data - never a
# synthetic fill, never an unverified route.

version: 1

signals:
  S1:
    direction: negative           # rising gap = more fragile
    percentile_window: 40         # ~10y of quarterly observations
    trend_quarters: 4             # one-year change
    thresholds:
      elevated: 10.0              # BIS 'red zone' prior (percent)
      above_trend: 0.0            # gap > 0 = credit above its HP trend

  S2:
    direction: negative           # rising DSR = more fragile
    percentile_window: 40
    trend_quarters: 4
    thresholds:
      elevated_percentile: 0.80   # own-history percentile of elevated DSR
      moderate_percentile: 0.50

  S3:
    # S3 (Property Vulnerability) proxy pool (B-package archived 2026-08-30):
    # four categories, equal-weight fragility-aligned percentile composite on
    # a quarterly index. Negative means rising raw values are more fragile;
    # positive means rising raw values are less fragile and are reversed.
    # Declared PRIORS, not fitted: percentile_window/trend_quarters anchor the
    # historical positioning; thresholds are percentile-of-own-history anchors
    # (composite is a 0..1 percentile), same convention as S2. 景气/杠杆 have
    # real data this window; 价格/资金 are now landed from the user-approved
    # Wind candidates. The engine still uses only closed quarterly cutoffs.
    direction: negative           # rising composite percentile = more fragile
    percentile_window: 20         # ~5y of quarterly proxy observations
    trend_quarters: 4             # one-year trend of the composite
    thresholds:
      elevated_percentile: 0.80   # own-history percentile: composite fragile
      moderate_percentile: 0.50
    # Price and developer funding are core confirmation dimensions: without
    # both through the declared window, S3 cannot be READY.
    required_inputs:
      - CN_NEW_HOUSE_PRICE_YOY
      - CN_PROPERTY_FUNDING_YOY
    input_directions:
      CN_REAL_ESTATE_CLIMATE: positive
      CN_HOUSEHOLD_LEVERAGE: negative
      CN_NEW_HOUSE_PRICE_YOY: positive
      CN_PROPERTY_FUNDING_YOY: positive
