# Indicator registry.
# series_id is the internal unique id; Wind column names are handled by the
# importer mapping layer (wind_mapping.yaml) and never leak into the engine.
#
# NOTE: transforms/direction are declared here for forward compatibility with
# V1.5 (Macro Monitor); V0/V1 only validate and store them.
# V1.3 migration: transform names unified to the V1.5A whitelist
# (level_gap -> neutral_gap, zscore -> robust_zscore); series feeding Core
# Signals remapped to the MASTER SPEC factors (growth / inflation /
# domestic_financial / global_financial). The legacy tags rates / credit / fx
# stay valid for series that only feed the Market Confirmation layer (M1-M6).
# Series added for the V1.3 signal registry are metadata-only registrations:
# they have no provider routing and no data yet (see signals availability).
#
# All fixture data behind these ids is SYNTHETIC until real Wind data is imported.

CN_PMI:
  name: 中国制造业PMI
  category: macro
  factor: growth
  frequency: monthly
  unit: index
  direction: positive
  weight: 1.0
  enabled: true
  transform:
    - type: neutral_gap
      reference: 50

CN_CPI_YOY:
  name: CPI同比
  category: macro
  factor: inflation
  frequency: monthly
  unit: percent
  direction: positive
  weight: 1.0
  enabled: true
  transform:
    - type: robust_zscore
      window: 60

